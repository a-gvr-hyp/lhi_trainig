_schema-version: 3.3.0
ID: trainig
description: A simple CAP project.
version: 1.0.0
modules:
- name: trainig-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: trainig-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: trainig-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: trainig-db
  parameters:
    buildpack: nodejs_buildpack
- name: trainig-destination-content
  type: com.sap.application.content
  requires:
  - name: trainig-destination-service
    parameters:
      content-target: true
  - name: trainig_html_repo_host
    parameters:
      service-key:
        name: trainig_html_repo_host-key
  - name: uaa_trainig
    parameters:
      service-key:
        name: uaa_trainig-key
  parameters:
    content:
      instance:
        destinations:
        - Name: training_ag_trainig_html_repo_host
          ServiceInstanceName: trainig-html5-app-host-service
          ServiceKeyName: trainig_html_repo_host-key
          sap.cloud.service: training_ag
        - Authentication: OAuth2UserTokenExchange
          Name: training_ag_uaa_trainig
          ServiceInstanceName: trainig-xsuaa-service
          ServiceKeyName: uaa_trainig-key
          sap.cloud.service: training_ag
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: trainig-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: trainig_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - book.zip
      name: book
      target-path: resources/
    - artifacts:
      - motocyclefiori.zip
      name: motocyclefiori
      target-path: resources/
    - artifacts:
      - motocyclefreestyle.zip
      name: motocyclefreestyle
      target-path: resources/
    - artifacts:
      - motocyclesmartelements.zip
      name: motocyclesmartelements
      target-path: resources/
    - artifacts:
      - motocyclefcl.zip
      name: motocyclefcl
      target-path: resources/
- name: book
  type: html5
  path: app/book
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: motocyclefiori
  type: html5
  path: app/motocycle_fiori
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: motocyclefreestyle
  type: html5
  path: app/motocycle_freestyle
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: motocyclesmartelements
  type: html5
  path: app/motocycle_smart_elements
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: motocyclefcl
  type: html5
  path: app/motocycle_fcl
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: trainig-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: trainig-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: trainig-destination-service
    service-plan: lite
- name: trainig_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: trainig-html5-app-host-service
    service-plan: app-host
- name: uaa_trainig
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: trainig-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
